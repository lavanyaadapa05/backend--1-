version: "3.9"

services:
  mysql-db:
    image: mysql:8.3
    container_name: payments-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: n3u3da!
      MYSQL_DATABASE: payments_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pn3u3da!"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - payments-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payments-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/payments_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: n3u3da!
    ports:
      - "8080:8080"
    networks:
      - payments-net

networks:
  payments-net:
    driver: bridge

volumes:
  mysql_data:

